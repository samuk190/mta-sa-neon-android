# JVM Memory & Garbage Collection (optimized for multi-core workstations)
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true

# Gradle Build Execution Optimizations
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=true
org.gradle.configuration-cache=true

# Android Gradle Plugin Optimizations
android.useAndroidX=true
android.enableJetifier=false

# Kotlin Compilation Optimizations
kotlin.incremental=true
kotlin.code.style=official
